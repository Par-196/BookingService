services:
  api:
    build:
      context: .
      dockerfile: BookingService/Dockerfile
    ports:
      - "8090:8080"
    environment:
      ConnectionStrings__DbConnectionString: Host=db;Port=5432;Database=booking_db;Username=postgres;Password=1234
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    
    
#    azurite / replaces blob storage

    